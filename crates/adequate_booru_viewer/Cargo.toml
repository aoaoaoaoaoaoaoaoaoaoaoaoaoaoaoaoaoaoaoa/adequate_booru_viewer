[package]
name = "adequate_booru_viewer"
default-run = "abv"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
autobins = false
description = "a somewhat-adequate booru reference viewer: fast local boolean-tag search, GPU water UI"
readme = "../../README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate_booru_viewer"
homepage = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate_booru_viewer"
keywords = ["booru", "danbooru", "egui", "wgpu", "viewer"]
categories = ["gui", "multimedia::images"]

[[bin]]
name = "abv"
path = "src/main.rs"

[[example]]
name = "retrieval_bench"
path = "examples/retrieval_bench.rs"

[features]
# Debug-only instrumentation umbrella. First tenant: the egui anchor probe
# (src/probe.rs) the demo xtask drives. Never in the default set, so shipped
# builds pay nothing.
devtools = ["dep:serde_json", "brass_poolrooms/instrumentation"]
egui-test = ["dep:egui-tester-witness", "eternalist-apps/egui-test"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
brass_poolrooms = "0.12.1"
abv-contract = { path = "../abv-contract", version = "0.2.0" }
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false }
egui-winit = { version = "=0.36.1", default-features = false, features = ["clipboard", "links"] }
egui-tester-witness = { version = "0.9.1", optional = true, features = ["egui"] }
eternalist-apps = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
memmap2 = "0.9.11"
redb = "4.1.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
toml = "1.1.4"
tracing = "0.1.44"
ureq = { version = "3.4.0", features = ["json"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[lints]
workspace = true

[package.metadata.packager]
product-name = "Adequate Booru Viewer"
identifier = "moe.eternalist.adequate-booru-viewer"
publisher = "Eternalist"
category = "Photography"
binaries = [{ path = "abv", main = true }]
resources = [{ src = "LICENSE-MIT", target = "LICENSE-MIT" }]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
compression = "lzma"
installer-mode = "currentUser"
languages = ["English"]
