# Pinned Filter Library for acceptance and the showcase: a Boolean reference
# filter and a peopleless one, each general-rated.

[[folder]]
name = "work"

[[folder.filter]]
name = "harmless screenshot"
query = "((blue_eyes AND red_hair) OR (blue_hair AND red_eyes)) AND 1girl AND ~comic AND ~greyscale AND looking_at_viewer AND rating:g"

[[folder]]
name = "play"

[[folder.filter]]
name = "scenery"
query = "no_humans AND scenery AND ~comic AND ~text_focus AND rating:g"
