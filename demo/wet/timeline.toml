# Window-relative choreography for `cargo xtask wet-demo`.
# The fixture opens at 1440×920, with live index/cache but staged config/state.
#
# The query starts with committed rating:g, then builds a visible filter by
# typing into the tag field. Autocomplete is demonstrated with both a click and
# Tab acceptance, but every essential term is also a valid literal so a slow
# suggestion worker cannot poison the filmed search.

