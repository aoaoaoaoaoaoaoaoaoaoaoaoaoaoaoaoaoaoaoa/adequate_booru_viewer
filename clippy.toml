# Keep this file tiny. Do not move the repo-wide allow/deny architecture here.

allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
  { path = "egui::FontId::monospace", reason = "use a Poolrooms TypeRole or chrome::spatial_font so accessibility scaling precedes layout" },
  { path = "egui::FontId::new", reason = "use a Poolrooms TypeRole or chrome::spatial_font so accessibility scaling precedes layout" },
  { path = "egui::FontId::proportional", reason = "use a Poolrooms TypeRole or chrome::spatial_font so accessibility scaling precedes layout" },
  { path = "egui::RichText::size", reason = "use a Poolrooms TypeRole so accessibility scaling precedes layout" },
  { path = "egui::RichText::small", reason = "use a Poolrooms TypeRole so accessibility scaling precedes layout" },
]
