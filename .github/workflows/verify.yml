name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  source:
    name: Source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Verify source
        run: scripts/check

  security:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: scripts/audit

  package:
    name: Published package graph
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify crates.io packages
        run: scripts/package

  lifecycle:
    name: Install and uninstall · Linux/X11
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native test substrate
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap dbus-user-session libxkbcommon-x11-0 mesa-vulkan-drivers xauth xvfb
      - name: Admit contained user services
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          test -S "$runtime/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime" >> "$GITHUB_ENV"
      - name: Normalize software Vulkan
        run: |
          root="$RUNNER_TEMP/egui-tester-lavapipe"
          library=$(find /usr/lib -name libvulkan_lvp.so -print -quit)
          manifest=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$library"
          test -f "$manifest"
          install -d "$root/usr/lib" "$root/usr/share/vulkan/icd.d"
          ln -s "$library" "$root/usr/lib/libvulkan_lvp.so"
          install -m 0644 "$manifest" "$root/usr/share/vulkan/icd.d/lvp_icd.json"
          printf 'EGUI_TESTER_LAVAPIPE=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify installation lifecycle
        env:
          ABV_INSTALL_ARTIFACTS: /tmp/abv-install-artifacts
        run: scripts/verify-install
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: abv-install-${{ github.run_id }}
          path: /tmp/abv-install-artifacts
          if-no-files-found: ignore
          retention-days: 7

  native-acceptance:
    name: Native acceptance · Linux/X11
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native test substrate
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap dbus-user-session libxkbcommon-x11-0 mesa-vulkan-drivers xauth xvfb
      - name: Admit contained user services
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          test -S "$runtime/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime" >> "$GITHUB_ENV"
      - name: Normalize software Vulkan
        run: |
          root="$RUNNER_TEMP/egui-tester-lavapipe"
          library=$(find /usr/lib -name libvulkan_lvp.so -print -quit)
          manifest=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$library"
          test -f "$manifest"
          install -d "$root/usr/lib" "$root/usr/share/vulkan/icd.d"
          ln -s "$library" "$root/usr/lib/libvulkan_lvp.so"
          install -m 0644 "$manifest" "$root/usr/share/vulkan/icd.d/lvp_icd.json"
          printf 'EGUI_TESTER_LAVAPIPE=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify native user story
        env:
          ABV_ACCEPTANCE_ARTIFACTS: /tmp/abv-acceptance-artifacts
        run: scripts/test-gui
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: abv-x11-${{ github.run_id }}
          path: /tmp/abv-acceptance-artifacts
          if-no-files-found: ignore
          retention-days: 7
