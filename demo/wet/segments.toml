# Ordered roster for `cargo xtask wet-demo`. Each name resolves to a
# choreography fragment at `segments/<name>.toml`. The continuous final take
# plays them all back-to-back from segment 01's entry state; `--segment <name>`
# replays one from its own entry; `--scaffold` regenerates every later entry
# from the app's own slate/config writer (the state-faithfulness test).
order = [
    "01-water-modes",
    "02-filter-library",
    "03-reference-query",
    "04-thumbnail-hover",
    "05-viewer",
    "06-finale",
]
