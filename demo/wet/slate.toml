# Base entry state for segment 01 (pre-record): DRY, 7-per-row, every recess
# and folder folded shut, `harmless screenshot` armed. `shutters` folds the
# three default-open recesses; the rest default closed. Later segments' entry
# states are regenerated by `cargo xtask wet-demo --scaffold`.
closed_folders = ["work", "play"]
sort = "score"
images_per_row = 7
water = "dry"
viewer_tags_open = false

[filter]
kind = "saved"
name = "harmless screenshot"

[shutters]
filter-library = false
active-filter = false
reference-query = false

[query]
active_group = []

[query.tree.root]
kind = "group"

[query.tree.root.group]
op = "and"

[[query.tree.root.group.children]]
kind = "atom"

[query.tree.root.group.children.atom]
kind = "rating"
value = "general"

[dates]
