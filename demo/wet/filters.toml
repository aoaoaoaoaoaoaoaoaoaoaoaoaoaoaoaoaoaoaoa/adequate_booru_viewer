# Pinned demo library. Two folders make the filmed "open work → harmless
# screenshot → copy" sequence literal and reproducible.

[[folder]]
name = "work"

[[folder.filter]]
name = "harmless screenshot"
query = "((blue_eyes AND red_hair) OR (blue_hair AND red_eyes)) AND 1girl AND ~comic AND ~greyscale AND looking_at_viewer AND rating:g"

[[folder]]
name = "play"

[[folder.filter]]
name = "scratch"
query = "rating:g"
